dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:.95rem}
dt{color:var(--muted)}dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.ac{position:relative}#sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:280px;overflow-y:auto}#sug li{padding:10px 12px;border-radius:6px;cursor:pointer}#sug li.on,#sug li:hover{background:var(--bg);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums}th{font-family:var(--body);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}td{padding:9px 10px;border-bottom:1px solid var(--line)}th:last-child,td:last-child{text-align:right}tr:last-child td{border-bottom:0}tr.me td{background:var(--accent);color:var(--surface);font-weight:500}tr.me td:first-child{border-radius:6px 0 0 6px}tr.me td:last-child{border-radius:0 6px 6px 0}
.fam{display:flex;flex-wrap:wrap;gap:6px 14px}.lnk{background:none;border:0;padding:2px 0;font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lg{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:-6px}.lg .lnk[aria-current]{color:var(--fg);text-decoration:none;font-weight:500}
.res{display:grid}.lr{display:grid;grid-template-columns:5.5rem 1fr auto;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.lr:last-child{border-bottom:0}.ln{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.lr .rank{font-size:2.2rem;font-variant-numeric:tabular-nums}.cp,.na{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.cur{padding:2px 0;font-weight:500}
.err{color:var(--muted)}
.note{font-size:.8rem;color:var(--muted)}

function build(raw){const byId=new Map(raw.map(p=>[p.speciesId,p])),par={};
const f=x=>{while((par[x]??=x)!==x)x=par[x];return x;},u=(a,b)=>{if(byId.has(a)&&byId.has(b))par[f(a)]=f(b);};
raw.forEach(p=>{const fm=p.family||{};if(fm.parent)u(p.speciesId,fm.parent);(fm.evolutions||[]).forEach(e=>u(p.speciesId,e));});
let out=[];const seen=new Set();
raw.forEach(p=>{const n=p.speciesName,id=p.speciesId,b=p.baseStats;if(!b||seen.has(n)||id.includes('shadow')||id.split('_').includes('mega'))return;seen.add(n);out.push([n,b.atk,b.def,b.hp,f(id)]);});
const base={};out.forEach(x=>{if(!x[0].includes('('))base[x[0]]=x.slice(1,4).join();});
out=out.filter(x=>!(x[0].includes('(')&&base[x[0].split(' (')[0]]===x.slice(1,4).join()));
const roots={};let k=0;out.forEach(x=>{x[4]=roots[x[4]]??=k++;});return out;}
function use(data){D=data;map=new Map(D.map(x=>[x[0].toLowerCase(),x]));for(const k in cache)delete cache[k];run();}
try{const c=JSON.parse(localStorage.getItem('gm')||'null');if(c&&c.d)use(c.d);}catch(e){}
(async()=>{let t=0;try{t=+JSON.parse(localStorage.getItem('gm')||'{}').t||0;}catch(e){}
if(Date.now()-t<864e5)return;
try{const r=await fetch(SRC,{cache:'no-cache'});if(!r.ok)return;const d=build(await r.json());if(d.length>500){use(d);try{localStorage.setItem('gm',JSON.stringify({t:Date.now(),d}));}catch(e){}}}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
