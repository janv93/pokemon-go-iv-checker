<style>
/* Layout: single column tool, input card on top, result readout below */
:root{--bg:#eef2f7;--surface:#ffffff;--fg:#14202e;--muted:#5b6b7d;--line:#d3dce6;--accent:#1d5fd1;--white:#c9d3de;--black:#1b1b1b;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--surface:#17202b;--fg:#e6edf5;--muted:#93a3b5;--line:#2a3746;--accent:#6ea2ff;--white:#ffffff;--black:#5c5c5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141c;--surface:#17202b;--fg:#e6edf5;--muted:#93a3b5;--line:#2a3746;--accent:#6ea2ff;--white:#ffffff;--black:#5c5c5c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px}
main{max-width:520px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.ivs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ivs input{text-align:center;font-family:var(--mono)}
.ac{position:relative}#sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:280px;overflow-y:auto}#sug li{padding:10px 12px;border-radius:6px;cursor:pointer}#sug li.on,#sug li:hover{background:var(--bg);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums}th{font-family:var(--body);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}td{padding:9px 10px;border-bottom:1px solid var(--line)}th:last-child,td:last-child{text-align:right}tr:last-child td{border-bottom:0}
.fam{display:flex;flex-wrap:wrap;gap:6px 14px}.lnk{background:none;border:0;padding:2px 0;font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ln{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.cur{padding:2px 0;font-weight:500}.ln{font-weight:700;font-size:.95rem;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}.rl{width:4.5rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:5px}.fam{align-items:baseline}
.err{color:var(--muted)}
</style>

</form>

const C=[0.094,0.16639787,0.21573247,0.25572005,0.29024988,0.3210876,0.34921268,0.3752356,0.39956728,0.42250001,0.44310755,0.46279839,0.48168495,0.49985844,0.51739395,0.53435433,0.55079269,0.56675452,0.58227891,0.59740001,0.61215729,0.62656713,0.64065295,0.65443563,0.667934,0.68116492,0.69414365,0.70688421,0.71939909,0.7317,0.73776948,0.74378943,0.74976104,0.75568551,0.76156384,0.76739717,0.7731865,0.77893275,0.78463697,0.79030001,0.79530001,0.8003,0.8053,0.81029999,0.81529999,0.82029999,0.82529999,0.83029999,0.83529999,0.84029999,0.84529999];
const L=[];C.forEach((m,i)=>{L.push([1+i,m]);if(i+1<C.length){const n=C[i+1];L.push([1.5+i,i<39?Math.sqrt((m*m+n*n)/2):(m+n)/2]);}});
let LG=1500;
function best(B,a,d,s,cap){let r=null;for(const [lv,m] of L){if(lv>cap)break;const A=(B[1]+a)*m,De=(B[2]+d)*m,S=(B[3]+s)*m;const cp=Math.max(10,Math.floor(A*Math.sqrt(De)*Math.sqrt(S)/10));if(cp<=LG)r={sp:A*De*Math.max(10,Math.floor(S)),lv,cp};else break;}return r;}
const cache={};
function table(B,cap){const k=B[0]+cap+'|'+LG;if(cache[k])return cache[k];const t=[];for(let a=0;a<16;a++)for(let d=0;d<16;d++)for(let s=0;s<16;s++){const r=best(B,a,d,s,cap);if(r)t.push({iv:[a,d,s],...r});}t.sort((x,y)=>y.sp-x.sp);return cache[k]=t;}
const $=id=>document.getElementById(id);
function iv(id){const v=parseInt($(id).value,10);return v>=0&&v<=15?v:null;}
const wordsOf=n=>n.toLowerCase().split(/[\s()\-.'\u2019:]+/).filter(Boolean);
function match(ws){const ws2=ws.flatMap(w=>wordsOf(w));const pre=D.filter(x=>{const n=wordsOf(x[0]);return ws2.every(w=>n.some(y=>y.startsWith(w)));});
const r=pre.length?pre:D.filter(x=>{const n=x[0].toLowerCase();return ws.every(w=>n.includes(w));});
return r.sort((x,y)=>(x[0].toLowerCase().startsWith(ws2[0])?0:1)-(y[0].toLowerCase().startsWith(ws2[0])?0:1)||(x[0].includes('(')?1:0)-(y[0].includes('(')?1:0));}
function find(v){v=v.trim().toLowerCase();if(map.has(v))return map.get(v);const ws=v.split(/[\s()]+/).filter(Boolean);if(!ws.length)return;const m=match(ws);return m.length===1?m[0]:undefined;}
function run(){const B=find($('sp').value);const a=iv('a'),d=iv('d'),s=iv('s');const o=$('out');
if(!B){o.innerHTML='<p class="err">Pick a Pokémon from the list.</p>';return;}
if(a===null||d===null||s===null){o.innerHTML='<p class="err">Enter IVs from 0 to 15.</p>';return;}
const LS=[['Little',500,'#e3350d','var(--white)','split'],['Great',1500,'#2f6fde','#e3350d',1],['Ultra',2500,'#e0b400','var(--black)',2],['Master',Infinity,'#8a3fd1','#ff6fc8',3]];
const stripes=(bg,fg,k)=>{if(k==='split')return 'linear-gradient(90deg,'+bg+' 0 50%,'+fg+' 50% 100%)';let g=[bg+' 0%'];for(let q=1;q<=k;q++){const c=q/(k+1)*100,w=5;g.push(bg+' '+(c-w)+'%',fg+' '+(c-w)+'%',fg+' '+(c+w)+'%',bg+' '+(c+w)+'%');}g.push(bg+' 100%');return 'linear-gradient(110deg,'+g.join(',')+')';};let rows='';
LG=Infinity;const maxCP=best(B,a,d,s,50).cp;let prev=0;
for(const [n,c,bg,fg,k] of LS){if(maxCP<=prev)break;prev=c;LG=c;const t=table(B,50);const j=t.findIndex(x=>x.iv[0]===a&&x.iv[1]===d&&x.iv[2]===s),i=j<0?-1:t.findIndex(x=>x.sp===t[j].sp);
rows+='<tr><td><span class="ln" style="background-image:'+stripes(bg,fg,k)+'">'+n+'</span></td>'+(i<0?'<td>–</td><td>–</td><td>over cap</td>':'<td>'+(i+1)+'</td><td>'+(t[j].sp/t[0].sp*100).toFixed(2)+'%</td><td>'+t[j].cp+'</td>')+'</tr>';}
const famAll=D.filter(x=>x[4]===B[4]),groups={};famAll.forEach(x=>(groups[x[5]]=groups[x[5]]||[]).push(x));
const par=x=>x[6]&&famAll.find(y=>y[0]===x[6]),dep=(x,k=0)=>{const p=par(x);return p&&k<5?dep(p,k+1)+1:0;};
for(const g in groups){const G=groups[g];for(let q=0;q<G.length;q++){const p=par(G[q]);if(p&&!G.includes(p))G.push(p);}G.sort((x,y)=>dep(x)-dep(y)||famAll.indexOf(x)-famAll.indexOf(y));}
const fam=famAll.length>1?Object.keys(groups).sort((p,q)=>(p?1:0)-(q?1:0)):[];
const sn=x=>x[0].replace(/ \((Alolan|Galarian|Hisuian|Paldean)\)/,'').replace(/</g,'&lt;');
o.innerHTML=fam.map(g=>'<div class="fam">'+(fam.length>1?'<span class="rl">'+(g||'Normal')+'</span>':'')+groups[g].map(x=>x===B?'<span class="cur">'+sn(x)+'</span>':'<button type="button" class="lnk" data-n="'+x[0].replace(/"/g,'&quot;')+'">'+sn(x)+'</button>').join('')+'</div>').join('')+'<table><thead><tr><th>League</th><th>Rank</th><th>%</th><th>CP</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
const sug=$('sug');let hi=-1,items=[];
function show(){const q=$('sp').value.trim().toLowerCase();if(!q){hide();return;}
const ws=q.split(/[\s()]+/).filter(Boolean);if(!ws.length){hide();return;}items=match(ws).slice(0,10);if(!items.length||(items.length===1&&items[0][0].toLowerCase()===q)){hide();return;}
hi=-1;sug.innerHTML=items.map((x,i)=>'<li role="option" data-i="'+i+'">'+x[0].replace(/</g,'&lt;')+'</li>').join('');sug.hidden=false;$('sp').setAttribute('aria-expanded','true');}
function hide(){sug.hidden=true;$('sp').setAttribute('aria-expanded','false');}
function pick(i){$('sp').value=items[i][0];hide();run();$('a').focus();}
sug.addEventListener('mousedown',e=>e.preventDefault());

$('f').addEventListener('submit',e=>{e.preventDefault();if(document.activeElement===$('sp')){if(sug.hidden)show();if(!sug.hidden&&items.length)pick(hi<0?0:hi);else{hide();run();$('a').focus();}}});

const SRC='https://raw.githubusercontent.com/pvpoke/pvpoke/master/src/data/gamemaster/pokemon.json';
function build(raw){const byId=new Map(raw.map(p=>[p.speciesId,p]));
const RG=/\((Alolan|Galarian|Hisuian|Paldean)\)/,reg=(id,k=0)=>{const p=byId.get(id),m=p.speciesName.match(RG);if(m)return m[1];const pa=(p.family||{}).parent;return pa&&byId.has(pa)&&k<5?reg(pa,k+1):'';};
let out=[];const seen=new Set();
raw.forEach(p=>{const n=p.speciesName,id=p.speciesId,b=p.baseStats,ps=id.split('_');if(!b||seen.has(n)||id.endsWith('_shadow')||ps.includes('mega')||ps.includes('primal'))return;seen.add(n);const fm=p.family||{},pa=byId.get(fm.parent);out.push([n,b.atk,b.def,b.hp,fm.id||id,reg(id),pa?pa.speciesName:'']);});
const base={};out.forEach(x=>{if(!x[0].includes('('))base[x[0]]=x.slice(1,4).join();});
out=out.filter(x=>!(x[0].includes('(')&&!RG.test(x[0])&&base[x[0].split(' (')[0]]===x.slice(1,4).join()));
const roots={};let k=0;out.forEach(x=>{x[4]=roots[x[4]]??=k++;});return out;}
function use(data){D=data;map=new Map(D.map(x=>[x[0].toLowerCase(),x]));for(const k in cache)delete cache[k];run();}
try{const c=JSON.parse(localStorage.getItem('gm4')||'null');if(c&&c.d)use(c.d);}catch(e){}
(async()=>{let t=0;try{t=+JSON.parse(localStorage.getItem('gm4')||'{}').t||0;}catch(e){}
if(Date.now()-t<864e5)return;
try{const r=await fetch(SRC,{cache:'no-cache'});if(!r.ok)return;const d=build(await r.json());if(d.length>500){use(d);try{localStorage.setItem('gm4',JSON.stringify({t:Date.now(),d}));}catch(e){}}}catch(e){}})();
