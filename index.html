<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--surface:#17202b;--fg:#e6edf5;--muted:#93a3b5;--line:#2a3746;--accent:#6ea2ff;--white:#ffffff;--black:#5c5c5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141c;--surface:#17202b;--fg:#e6edf5;--muted:#93a3b5;--line:#2a3746;--accent:#6ea2ff;--white:#ffffff;--black:#5c5c5c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px}
main{max-width:520px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.ivs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ivs input{text-align:center;font-family:var(--mono)}
.ac{position:relative}#sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:280px;overflow-y:auto}#sug li{padding:10px 12px;border-radius:6px;cursor:pointer}#sug li.on,#sug li:hover{background:var(--bg);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums}th{font-family:var(--body);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}td{padding:9px 10px;border-bottom:1px solid var(--line)}th:last-child,td:last-child{text-align:right}tr:last-child td{border-bottom:0}
.fam{display:flex;flex-wrap:wrap;gap:6px 14px}.lnk{background:none;border:0;padding:2px 0;font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ln{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.cur{padding:2px 0;font-weight:700}.pn{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}.lnk{text-decoration-color:var(--muted);font-weight:500}.ln{font-weight:700;font-size:.95rem;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}.rl{width:4.5rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:5px}.fam{align-items:baseline}
.err{color:var(--muted)}
.note{margin:0;font-size:.8rem;color:var(--muted);text-align:center}
</style>

</div>
<button type="submit" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0"></button>
</form>

raw.forEach(p=>{const n=p.speciesName,id=p.speciesId,b=p.baseStats,ps=id.split('_');if(!b||seen.has(n)||id.endsWith('_shadow')||ps.includes('mega')||ps.includes('primal'))return;seen.add(n);const fm=p.family||{},pa=byId.get(fm.parent);out.push([n,b.atk,b.def,b.hp,fm.id?fm.id.replace(/_(ALOLAN?|GALARIAN|GALAR|HISUIAN|HISUI|PALDEAN|PALDEA)$/,''):'X_'+id.split('_')[0],reg(id),pa?pa.speciesName:'']);});
const base={};out.forEach(x=>{if(!x[0].includes('('))base[x[0]]=x.slice(1,4).join();});
out=out.filter(x=>!(x[0].includes('(')&&!RG.test(x[0])&&!TAU.test(x[0])&&base[x[0].split(' (')[0]]===x.slice(1,4).join()));
const roots={};let k=0;out.forEach(x=>{x[4]=roots[x[4]]??=k++;});return out;}
const fmt=t=>new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});

const SNAP='2026-11-01T17:37:49Z';

try{const c=JSON.parse(localStorage.getItem('gm6')||'null');if(c&&c.d)use(c.d,c.c||c.t);}catch(e){}
(async()=>{let c={};try{c=JSON.parse(localStorage.getItem('gm6')||'{}')||{};}catch(e){}
if(Date.now()-(c.t||0)<864e5)return;
let sha='',cd='';try{const r=await fetch('https://api.github.com/repos/pvpoke/pvpoke/commits?path=src/data/gamemaster/pokemon.json&per_page=1');if(r.ok){const j=await r.json();sha=j[0].sha;cd=j[0].commit.committer.date;}}catch(e){}
